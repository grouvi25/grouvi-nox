# VPS Sentinel - vps.grouvi.online
# Origin is reachable only through Cloudflare; direct hits are dropped.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=sentinel_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=sentinel_all:10m rate=240r/m;

server {
    listen 80;
    listen [::]:80;
    server_name vps.grouvi.online;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vps.grouvi.online;

    ssl_certificate     /etc/letsencrypt/live/vps.grouvi.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps.grouvi.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SentinelSSL:5m;
    ssl_session_timeout 1h;
    ssl_stapling on;
    ssl_stapling_verify on;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    # Only Cloudflare may talk to this vhost.
    include /etc/nginx/snippets/cloudflare-allow.conf;
    deny all;

    access_log /var/log/nginx/sentinel_access.log;
    error_log  /var/log/nginx/sentinel_error.log warn;

    client_max_body_size 64k;
    client_body_timeout 15s;
    server_tokens off;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /auth/ {
        limit_req zone=sentinel_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3999;
        include /etc/nginx/snippets/sentinel-proxy.conf;
    }

    location /stream {
        proxy_pass http://127.0.0.1:3999;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        limit_req zone=sentinel_all burst=60 nodelay;
        proxy_pass http://127.0.0.1:3999;
        include /etc/nginx/snippets/sentinel-proxy.conf;
    }
}
