# Managed by VPS Sentinel. Local edits may be overwritten by reinstall/update.
server {
    listen 80;
    listen [::]:80;
    server_name @@DOMAIN@@;

    location /.well-known/acme-challenge/ {
        root /var/www/vps-sentinel-acme;
        allow all;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl@@HTTP2_LISTEN@@;
    listen [::]:443 ssl@@HTTP2_LISTEN@@;
@@HTTP2_DIRECTIVE@@
    server_name @@DOMAIN@@;

    ssl_certificate     /etc/letsencrypt/live/@@DOMAIN@@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@@DOMAIN@@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SentinelSSL:5m;
    ssl_session_timeout 1h;
    server_tokens off;

@@REALIP_INCLUDE@@
@@ORIGIN_GUARD@@

    access_log /var/log/nginx/vps-sentinel-access.log;
    error_log  /var/log/nginx/vps-sentinel-error.log warn;
    client_max_body_size 64k;
    client_body_timeout 15s;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /auth/ {
        limit_req zone=sentinel_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:@@PORT@@;
        include /etc/nginx/snippets/sentinel-proxy.conf;
    }

    location /stream {
        proxy_pass http://127.0.0.1:@@PORT@@;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        limit_req zone=sentinel_all burst=60 nodelay;
        proxy_pass http://127.0.0.1:@@PORT@@;
        include /etc/nginx/snippets/sentinel-proxy.conf;
    }
}
