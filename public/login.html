<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<title>Вход · VPS Sentinel</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.svg">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
      <path class="m-shape" d="M12 2.4 21.4 9.2 17.8 20.2 6.2 20.2 2.6 9.2Z"/>
      <path class="m-pulse" d="M6.6 13.4h2.5l1.6-3.6 2.2 6.9 1.6-3.3h2.9"/>
    </svg>
    <h1>VPS Sentinel</h1>
    <p class="lead">Вход по ключу доступа этого компьютера. Windows попросит подтвердить личность: PIN, отпечаток или пароль учётной записи.</p>

    <button class="btn-primary" id="loginBtn">Войти по ключу доступа</button>
    <button class="btn-link" id="recoverLink">Потерял доступ? Ввести код восстановления</button>

    <div id="recoverBox" class="hidden mt-md">
      <input class="code" id="recoverCode" placeholder="XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false" maxlength="14">
      <button class="btn-primary" id="recoverBtn">Восстановить доступ</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>
</div>
<script src="/login.js" type="module"></script>
</body>
</html>
