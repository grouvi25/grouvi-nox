<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Вход · VPS Sentinel</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2335d6a4'/></svg>">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="logo">S</div>
    <h1>VPS Sentinel</h1>
    <p class="lead">Вход по ключу доступа этого компьютера. Windows попросит подтвердить личность: PIN, отпечаток или пароль от учётной записи.</p>

    <button class="btn-primary" id="loginBtn">Войти по ключу доступа</button>
    <button class="btn-link" id="recoverLink">Потерял доступ? Использовать код восстановления</button>

    <div id="recoverBox" class="hidden" style="margin-top:18px">
      <input class="code" id="recoverCode" placeholder="XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false" maxlength="14">
      <button class="btn-primary" id="recoverBtn">Восстановить доступ</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>
</div>
<script src="/login.js" type="module"></script>
</body>
</html>
