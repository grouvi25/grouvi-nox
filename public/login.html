<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<title>Вход · Grouvi Nox</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.svg">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
      <path class="m-shape" d="M12 2.8 21.13 9.43 17.64 20.17 6.36 20.17 2.87 9.43Z"/>
      <path class="m-pulse" d="M6.9 13.6h2.6l1.3-2.9 1.9 5.8 1.3-2.9h3.1"/>
    </svg>
    <h1>Grouvi Nox</h1>
    <p class="lead">Вход по ключу доступа этого компьютера. Windows попросит подтвердить личность: PIN, отпечаток или пароль учётной записи.</p>

    <button class="btn-primary" id="loginBtn">Войти по ключу доступа</button>
    <button class="btn-link" id="recoverLink">Потерял доступ? Ввести код восстановления</button>

    <div id="recoverBox" class="hidden mt-md">
      <input class="code" id="recoverCode" placeholder="XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false" maxlength="14">
      <button class="btn-primary" id="recoverBtn">Восстановить доступ</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>
</div>
<script src="/login.js" type="module"></script>
</body>
</html>
