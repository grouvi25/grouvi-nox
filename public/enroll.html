<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<title>Привязка ключа · Grouvi Nox</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.svg">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
      <path class="m-shape" d="M12 2.8 21.13 9.43 17.64 20.17 6.36 20.17 2.87 9.43Z"/>
      <path class="m-pulse" d="M6.9 13.6h2.6l1.3-2.9 1.9 5.8 1.3-2.9h3.1"/>
    </svg>
    <h1>Привязка ключа доступа</h1>
    <p class="lead">Windows создаст ключ доступа и оставит его в защищённом хранилище этого компьютера. Ключ никогда не покидает устройство и не хранится на сервере.</p>

    <input class="code" id="label" placeholder="Название устройства, например: Рабочий ПК" maxlength="40" autocomplete="off">
    <button class="btn-primary" id="enrollBtn">Создать ключ доступа</button>

    <div class="msg" id="msg"></div>
  </div>
</div>
<script src="/enroll.js" type="module"></script>
</body>
</html>
