<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Привязка ключа · VPS Sentinel</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2335d6a4'/></svg>">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="logo">S</div>
    <h1>Привязка ключа доступа</h1>
    <p class="lead">Сейчас Windows предложит создать ключ доступа. Он останется в защищённом хранилище этого компьютера и никогда не покинет его. Подтвердите PIN-кодом, отпечатком или паролем учётной записи.</p>

    <input class="code" id="label" placeholder="Название устройства, например: Рабочий ПК" maxlength="40" autocomplete="off">
    <button class="btn-primary" id="enrollBtn">Создать ключ доступа</button>

    <div class="msg" id="msg"></div>
  </div>
</div>
<script src="/enroll.js" type="module"></script>
</body>
</html>
