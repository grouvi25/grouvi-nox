<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- VPS Sentinel. Outlined point-up pentagon, same construction as the
       tempmail glyph. Where mail draws an envelope flap inside the shape,
       we draw a heartbeat: the pentagon is the host, the pulse says it is
       alive and being watched. -->
  <g fill="none" stroke="#F4EDE4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.8 21.13 9.43 17.64 20.17 6.36 20.17 2.87 9.43Z"/>
    <path d="M6.9 13.6h2.6l1.3-2.9 1.9 5.8 1.3-2.9h3.1" stroke-width="1.9"/>
  </g>
</svg>
