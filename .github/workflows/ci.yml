name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sentinel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium for visual contract
        run: npx playwright install --with-deps chromium
      - name: Unit, coverage and visual contract tests
        env:
          STATE_DIR: ${{ runner.temp }}/sentinel-test-state
        run: npm run check
      - name: JavaScript syntax
        run: find src bin public -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Shell syntax and ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          find deploy scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash -n bin/sentinelctl
          bash -n bin/noxctl
          shellcheck -S warning deploy/install.sh deploy/lib/common.sh bin/sentinelctl scripts/*.sh
      - name: Database and incident smoke test
        run: |
          STATE_DIR="$RUNNER_TEMP/state" node --input-type=module <<'NODE'
          const db = await import('./src/database.js')
          db.initDatabase()
          const snapshot = {
            cpu:{usage:10}, memory:{usedPct:25,swapPct:0}, load:{one:.1},
            network:{rxRate:1,txRate:1}, diskIo:{readRate:1,writeRate:1},
            filesystems:[{mount:'/',usedPct:20}], containers:{stopped:0,unhealthy:0}, pm2:{down:0},
            alerts:[{key:'ci:test',level:'warning',message:'CI test'}]
          }
          db.recordMetric(snapshot)
          if (db.getHistory('24h').rows.length !== 1) process.exit(1)
          if (db.syncIncidents(snapshot.alerts).length !== 1) process.exit(1)
          if (db.acknowledgeIncident(1)?.status !== 'acknowledged') process.exit(1)
          if (db.resolveIncident(1)?.status !== 'resolved') process.exit(1)
          const fleet = {
            schema:1, node:{id:'ci-node',name:'CI node',publicUrl:'https://ci.example',version:'1.4.0'},
            snapshot:{...snapshot,alerts:[],update:{current:'1.4.0',available:false}}
          }
          db.ingestFleetSnapshot('ci-node', fleet)
          if (db.listFleetNodes()[0]?.id !== 'ci-node') process.exit(1)
          if (db.fleetHistory('ci-node','24h').rows.length !== 1) process.exit(1)
          NODE
      - name: Installer dry-run
        run: sudo ./deploy/install.sh --domain monitor.example.com --email ops@example.com --proxy public --skip-dns-check --dry-run --non-interactive -y
      - name: Build and verify release bundle
        run: |
          ./scripts/build-release.sh "v$(node -p "require('./package.json').version")" dist
          ./scripts/verify-release.sh dist/grouvi-nox-v$(node -p "require('./package.json').version")-linux.tar.gz dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-ci-bundle
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          retention-days: 7
