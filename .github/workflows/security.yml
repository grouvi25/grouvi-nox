name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinel-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

  supply-chain:
    name: Secrets and runtime dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Block forbidden runtime licenses
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),blocked=/^(AGPL-3\.0|GPL-3\.0)(-only|-or-later)?$/i,found=[];
          const walk=dir=>{for(const entry of fs.readdirSync(dir,{withFileTypes:true})){if(entry.name.startsWith('.'))continue;const full=path.join(dir,entry.name);if(entry.isDirectory()){const pkg=path.join(full,'package.json');if(fs.existsSync(pkg)){try{const p=JSON.parse(fs.readFileSync(pkg));if(blocked.test(String(p.license||'')))found.push(`${p.name}@${p.version}: ${p.license}`)}catch{}}walk(full)}}};
          walk('node_modules');if(found.length){console.error(`Forbidden runtime licenses:\n${found.join('\n')}`);process.exit(1)}
          NODE
      - name: Block common credential formats
        shell: bash
        run: |
          if git grep -n -I -E '(ghp_[A-Za-z0-9]{20,}|BEGIN (OPENSSH|RSA|EC) PRIVATE KEY|bot[0-9]{8,}:[A-Za-z0-9_-]{20,})' -- ':!package-lock.json'; then
            echo 'Potential credential committed to the repository.' >&2
            exit 1
          fi
